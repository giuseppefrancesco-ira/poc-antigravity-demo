      <div class="mob-screen active" id="mobScreenChat">
        <div class="intestazione-thread mob-chat-header">
          <div class="titolo-left" style="gap:8px;flex:1;min-width:0;">
            <button class="btn-top icon-only mob-hdr-btn" onclick="setMobileTab('inbox')" title="Torna alla lista Messaggi">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
              </svg>
            </button>
            <div class="mob-thread-title-group" id="mobileThreadHeaderLeft" style="display:inline-flex;align-items:center;gap:6px;">
              <!-- Populated dynamically by app.js like desktop -->
            </div>
          </div>
          <div class="controlli-right mob-chat-controls">
            <button class="btn-top icon-only mob-hdr-btn ocr-mob-btn" title="Importa messaggio ospite da foto (OCR)" onclick="openGuestOcrModal()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/>
              </svg>
            </button>
            <button class="btn-scarica-msg mob-hdr-btn" title="Scarica messaggi" onclick="triggerHubSync()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5467" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
            <div class="hdr-more-wrap">
              <button class="btn-top icon-only mob-hdr-btn" id="btnMoreMenuMob" title="Azioni conversazione e dati ospite" onclick="toggleHeaderMoreMenu(event, 'mob')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
                </svg>
              </button>
              <div class="hdr-more-dropdown" id="hdrMoreDropdownMob">
                <button type="button" class="hdr-more-item" onclick="closeHeaderMoreMenu();openEditGuestPmsModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                  </svg>
                  <span>Modifica dati ospite</span>
                </button>
                <button type="button" class="hdr-more-item" onclick="closeHeaderMoreMenu();openGenerateReviewModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#FACC15" stroke="#EAB308" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                  <span>Genera recensione</span>
                </button>
                <button type="button" class="hdr-more-item" onclick="closeHeaderMoreMenu();archiveCurrentConversation()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>
                  </svg>
                  <span>Archivia conversazione</span>
                </button>
                <button type="button" class="hdr-more-item danger" onclick="closeHeaderMoreMenu();deleteCurrentConversation()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                  </svg>
                  <span>Elimina conversazione</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="area-messaggi" id="mobileMessagesArea"></div>
        <div class="bottom-composer-wrap mobile" id="mobileBottomComposer"></div>
      </div>

      <!-- SCREEN 3: Dettagli ospite Mobile -->
      <div class="mob-screen" id="mobScreenAI">
        <div class="intestazione-thread mob-chat-header">
          <div class="titolo-left" style="gap:10px;">
            <button class="btn-top icon-only mob-hdr-btn" onclick="setMobileTab('inbox')" title="Torna alla lista Messaggi">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
              </svg>
            </button>
            <div class="mob-ai-hdr-title" style="display:inline-flex;align-items:center;gap:7px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="titolo-messaggi" style="font-size:15px;font-weight:700;">Dettagli ospite</span>
            </div>
          </div>
        </div>
        <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;" id="mobileSiderAI"></div>
      </div>

      <!-- Bottom Bar Conversazione Mobile (SOLO Chat e Dettagli Ospite/PMS quando si accede a una conversazione) -->
      <nav class="mob-bottom-bar" id="mobConvBottomBar">
        <div class="mob-tabs-row">
          <button class="mob-tab active" id="mobNavChat" onclick="setMobileTab('chat')">
            <div class="mob-tab-pill">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <span>Chat</span>
          </button>

          <button class="mob-tab" id="mobNavAI" onclick="setMobileTab('ai')">
            <div class="mob-tab-pill">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <span>Dettagli ospite</span>
          </button>
        </div>
        <div class="home-indicator"></div>
      </nav>

    </div>

  </main>

  <!-- Modal / Drawer Overlay (Scheda Soggiorno & Aggancio PMS / Nuova Conversazione) -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal-card" id="modalContent"></div>
  </div>

  <div class="toast" id="toastBox"></div>

  <script src="app.js?v=20261103_67"></script>
</body>
</html>
